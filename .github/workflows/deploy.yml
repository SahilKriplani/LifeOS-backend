name: Deploy to EC2

# Push to main -> build a new image, push it to ECR, then tell EC2 to pull and
# restart with it. The .env file with real secrets lives only on the EC2 box
# (created manually) and is never touched by this workflow.
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:latest"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ECR_REPOSITORY="${{ secrets.ECR_REPOSITORY }}"
            REGISTRY_HOST="${ECR_REPOSITORY%%/*}"
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin "$REGISTRY_HOST"
            docker pull "$ECR_REPOSITORY:latest"
            docker stop lifeos-api || true
            docker rm lifeos-api || true
            docker run -d --name lifeos-api --restart unless-stopped \
              --env-file /home/ec2-user/LifeOS-backend/.env \
              -p 8000:8000 \
              "$ECR_REPOSITORY:latest"
            docker image prune -f
